name: Build League of Legends Bot

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

env:
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build LeagueBot
    runs-on: windows-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Install .NET Framework 4.7.2 Developer Pack
      #    The csproj targets v4.7.2. Without this, MSBuild fails
      #    with MSB3644 "reference assemblies not found".
      # ------------------------------------------------------------
      - name: Install .NET Framework 4.7.2 Developer Pack
        shell: pwsh
        run: |
          choco install netfx-4.7.2-devpack --yes --no-progress

      # ------------------------------------------------------------
      # 3. Setup MSBuild
      # ------------------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # ------------------------------------------------------------
      # 4. Setup NuGet
      # ------------------------------------------------------------
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # ------------------------------------------------------------
      # 5. Locate LeagueBot.csproj directly
      #    We deliberately DO NOT build LeagueBot.sln because it
      #    references two projects that are not present in the repo:
      #      - ColorPicker\ColorViewer.csproj
      #      - LeagueBot.Updater\LeagueBot.Updater.csproj
      #    Building the csproj directly sidesteps those missing refs.
      # ------------------------------------------------------------
      - name: Locate LeagueBot.csproj
        id: find_csproj
        shell: pwsh
        run: |
          $csproj = Get-ChildItem -Path . -Recurse -Filter LeagueBot.csproj |
                    Where-Object { $_.FullName -notmatch '\\(obj|bin|packages)\\' } |
                    Select-Object -First 1
          if (-not $csproj) {
              Write-Error "LeagueBot.csproj not found."
              exit 1
          }
          Write-Host "Found csproj: $($csproj.FullName)"
          "csproj_path=$($csproj.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "csproj_dir=$($csproj.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ------------------------------------------------------------
      # 6. Restore NuGet packages for LeagueBot.csproj
      #    If packages.config exists, nuget restore reads it.
      #    Otherwise, we fall back to adding Newtonsoft.Json and
      #    the other needed packages explicitly.
      # ------------------------------------------------------------
      - name: Restore NuGet packages
        shell: pwsh
        working-directory: ${{ steps.find_csproj.outputs.csproj_dir }}
        run: |
          $csproj = "${{ steps.find_csproj.outputs.csproj_path }}"
          $pkgConfig = Join-Path "${{ steps.find_csproj.outputs.csproj_dir }}" "packages.config"

          if (Test-Path $pkgConfig) {
              Write-Host "Found packages.config — restoring from it."
              nuget restore $pkgConfig -PackagesDirectory ..\..\packages -NonInteractive -Verbosity detailed
          } else {
              Write-Host "No packages.config — restoring csproj directly."
              nuget restore $csproj -NonInteractive -Verbosity detailed
          }

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------------------------------------------------
      # 7. Ensure Newtonsoft.Json is present
      #    The project references Newtonsoft.Json via HintPath
      #    (..\..\packages\Newtonsoft.Json.*\lib\net45\...).
      #    If it's missing, install it explicitly.
      # ------------------------------------------------------------
      - name: Ensure Newtonsoft.Json is available
        shell: pwsh
        working-directory: ${{ steps.find_csproj.outputs.csproj_dir }}
        run: |
          $packagesRoot = Resolve-Path "..\..\packages" -ErrorAction SilentlyContinue
          if (-not $packagesRoot) {
              $packagesRoot = Join-Path (Resolve-Path "..\..").Path "packages"
              New-Item -ItemType Directory -Path $packagesRoot -Force | Out-Null
          }
          $existing = Get-ChildItem -Path $packagesRoot -Filter "Newtonsoft.Json*" -Directory -ErrorAction SilentlyContinue
          if (-not $existing) {
              Write-Host "Newtonsoft.Json not found in packages. Installing 12.0.3..."
              nuget install Newtonsoft.Json -Version 12.0.3 -OutputDirectory $packagesRoot -NonInteractive
          } else {
              Write-Host "Newtonsoft.Json already present: $($existing.Name)"
          }

      # ------------------------------------------------------------
      # 8. Build LeagueBot.csproj directly
      #    - /p:AllowUnsafeBlocks=true  → required by FastBitmap.cs
      #    - /p:Platform=AnyCPU          → matches the csproj
      #    - /p:TargetFrameworkVersion=v4.7.2 → pinned explicitly
      # ------------------------------------------------------------
      - name: Build LeagueBot.csproj
        shell: pwsh
        working-directory: ${{ steps.find_csproj.outputs.csproj_dir }}
        run: |
          $csproj = "${{ steps.find_csproj.outputs.csproj_path }}"
          $config = "${{ env.CONFIGURATION }}"
          Write-Host "Building $csproj | Config: $config"

          msbuild "$csproj" `
            /p:Configuration=$config `
            /p:Platform=AnyCPU `
            /p:TargetFrameworkVersion=v4.7.2 `
            /p:AllowUnsafeBlocks=true `
            /p:RestorePackages=false `
            /m `
            /verbosity:minimal `
            /nologo `
            /consoleloggerparameters:Summary

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------------------------------------------------
      # 9. Verify a build output exists
      # ------------------------------------------------------------
      - name: Verify build output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Include LeagueBot.exe,*.dll |
                 Where-Object { $_.FullName -notmatch "\\obj\\" -and
                                $_.FullName -notmatch "\\packages\\" -and
                                $_.FullName -match "\\${{ env.CONFIGURATION }}\\" }
          if (-not $exe) {
              Write-Error "No build output produced."
              exit 1
          }
          $exe | ForEach-Object { Write-Host "Built: $($_.FullName)" }

      # ------------------------------------------------------------
      # 10. Upload artifacts
      # ------------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeagueBot-${{ env.CONFIGURATION }}
          path: |
            **/bin/${{ env.CONFIGURATION }}/**
            Binaries/**
            !**/obj/**
            !**/packages/**
          if-no-files-found: error
          retention-days: 30
